# Build, test and publish Speaka: the tweak (.deb) and the app (.tipa/.ipa).
#
#   push to any branch         -> build + package + verify
#   push to main               -> ...and publish release v<version> with the .deb and the app (notes: the commit messages)
#   push of a tag like v9.4.0  -> ...and publish that tag as a release
#   Actions tab > Run workflow -> same as a push to the selected branch
#
# No secrets are needed: publishing uses the built-in GITHUB_TOKEN.
# Why macOS: the iPhoneOS SDK ships inside Xcode, which only exists on the macOS runner image.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel runs on main or tags (they publish). Do cancel superseded runs on other branches.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ---------------------------------------------------------------------------------------------
  # Compile for arm64 + arm64e, package as a rootless .deb, and assert the package is sane.
  # ---------------------------------------------------------------------------------------------
  build:
    name: Build .deb (rootless, arm64 + arm64e)
    runs-on: macos-15            # pinned on purpose; macos-latest is moving to macOS 26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode and show the iPhoneOS SDK
        run: |
          XCODE=/Applications/Xcode_16.4.app
          if [ -d "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          else
            echo "::warning::$XCODE not found, using the image default"
          fi
          xcodebuild -version
          echo "iPhoneOS SDK path   : $(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK version: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install build tools (GNU make, ldid, dpkg)
        run: |
          brew install make ldid dpkg xz
          # Theos needs GNU make 4.x; macOS ships 3.81
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos
        run: |
          git clone --quiet --recursive --depth=1 --shallow-submodules https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          echo "THEOS=$THEOS"
          make --version | sed -n '1p'
          dpkg-deb --version | sed -n '1p'
          echo "ldid   : $(command -v ldid)"
          echo "clang  : $(xcrun --find clang)"

      - name: Compute and stamp the package version
        id: version
        run: |
          set -euo pipefail
          version="$(bash tools/release_version.sh)"   # the app job computes the same number
          sed -i.bak "s/^Version:.*/Version: ${version}/" control
          rm -f control.bak
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${version}"

      # Theos references vendor_sbc/{sbc,bits}.c from audiohelper/Makefile.
      # Those third-party sources are intentionally NOT committed.  They must
      # be fetched before both the decoder regression and the Theos build.
      - name: Fetch pinned Google libsbc (required for v7.6)
        run: |
          set -euo pipefail
          bash tools/fetch_google_sbc.sh
          for f in sbc.c bits.c sbc.h bits.h LICENSE UPSTREAM_COMMIT; do
            test -s "audiohelper/vendor_sbc/$f" || {
              echo "::error::Missing decoder dependency: audiohelper/vendor_sbc/$f"
              exit 1
            }
          done
          echo "Fetched pinned libsbc: $(cat audiohelper/vendor_sbc/UPSTREAM_COMMIT)"

      # In CI, tests/test_audio.py fails if the sources are missing, and compares the live decoder's PCM
      # with FFmpeg's decode of the same recording from the phone.
      - name: Validate C/C++ linkage and SBC decoder waveform
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Build and package
        run: make clean package FINALPACKAGE=1

      - name: Verify the package
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(packages/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .deb in packages/, found ${#debs[@]}"
            ls -la packages || true
            exit 1
          fi
          deb="${debs[0]}"
          echo "::group::control"; dpkg-deb -I "$deb"; echo "::endgroup::"
          echo "::group::contents"; dpkg-deb -c "$deb"; echo "::endgroup::"

          rm -rf pkgroot && mkdir pkgroot && dpkg-deb -x "$deb" pkgroot
          dylib="$(find pkgroot -name 'Speaka.dylib' | sed -n '1p')"
          plist="$(find pkgroot -name 'Speaka.plist' | sed -n '1p')"
          [ -n "$dylib" ] || { echo "::error::Speaka.dylib is not in the package"; exit 1; }
          [ -n "$plist" ] || { echo "::error::Speaka.plist (the injection filter) is not in the package"; exit 1; }

          # The test requires the standalone SBC decoding helper in the .deb.
          helper="$(find pkgroot -type f -name 'BTPSAudioHelper' | sed -n '1p')"
          [ -n "$helper" ] || { echo "::error::BTPSAudioHelper missing from the .deb"; exit 1; }
          case "$helper" in
            pkgroot/var/jb/usr/bin/BTPSAudioHelper) ;;
            *) echo "::error::Unexpected helper installation path: $helper"; exit 1 ;;
          esac
          echo "Audio helper bundled: $helper"

          # 1. rootless layout: everything lives under /var/jb
          case "$dylib" in
            pkgroot/var/jb/Library/MobileSubstrate/DynamicLibraries/*) ;;
            *) echo "::error::dylib is not under /var/jb/Library/MobileSubstrate/DynamicLibraries (found: $dylib)"; exit 1 ;;
          esac
          arch="$(dpkg-deb -f "$deb" Architecture)"
          [ "$arch" = "iphoneos-arm64" ] || { echo "::error::Architecture is '$arch', expected iphoneos-arm64"; exit 1; }

          # 2. both slices. bluetoothd is arm64e: without that slice the dylib compiles fine and never loads.
          archs="$(lipo -archs "$dylib")"
          echo "slices: $archs"
          case " $archs " in *" arm64e "*) ;; *) echo "::error::no arm64e slice in the dylib"; exit 1 ;; esac
          case " $archs " in *" arm64 "*) ;; *) echo "::warning::no plain arm64 slice" ;; esac

          # 3. linkage: nothing may point at rootful paths
          echo "::group::otool -L"; otool -L "$dylib"; echo "::endgroup::"
          if otool -L "$dylib" | grep -E '/Library/Frameworks/CydiaSubstrate|/usr/lib/libsubstrate'; then
            echo "::warning::dylib links libsubstrate by a rootful path; it may fail to load on a rootless jailbreak"
          fi

          # 4. code signature (Theos fake-signs with ldid; unsigned dylibs are refused by the kernel)
          sigs="$(otool -l "$dylib" | grep -c LC_CODE_SIGNATURE || true)"
          if [ "${sigs:-0}" -eq 0 ]; then
            echo "::warning::no LC_CODE_SIGNATURE in the dylib"
          fi

          # 5. the injection filter must name bluetoothd, and must be a valid plist
          grep -q bluetoothd "$plist" || { echo "::error::filter plist does not mention bluetoothd"; exit 1; }
          plutil -lint "$plist" || echo "::warning::plutil could not lint the filter plist"

          echo "Package OK: $(basename "$deb")  Version: $(dpkg-deb -f "$deb" Version)"

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          # Published as Speaka_<version>_<arch>.deb. dpkg reads the package ID from inside the file, so it still
          # installs over earlier com.parv.speaka packages.
          for deb in packages/*.deb; do
            name="$(basename "$deb")"
            cp "$deb" "dist/Speaka_${name#*_}"
          done
          ( cd dist && shasum -a 256 *.deb > SHA256SUMS && cat SHA256SUMS )
          {
            echo "### Build ${GITHUB_RUN_NUMBER}"
            echo ""
            echo "- Package: \`$(basename dist/*.deb)\`"
            echo "- Version: \`$(dpkg-deb -f dist/*.deb Version)\`"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- Slices: \`$(lipo -archs "$(find pkgroot -name Speaka.dylib | sed -n '1p')")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub's artifact service sometimes times out after a good build (run 62: ETIMEDOUT on the app's upload, so its
      # release went out with only the .deb). One more try, 30 s later, before the job fails.
      - name: Upload the package
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Speaka-deb
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Wait, then upload the package again
        if: steps.upload.outcome == 'failure'
        run: sleep 30

      - name: Upload the package (second try)
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: Speaka-deb
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # ---------------------------------------------------------------------------------------------
  # The Speaka companion app (app/) as a TrollStore package, built like Caz: SwiftUI, XcodeGen and xcodebuild.
  # Separate from the tweak on purpose: if the app fails to build, the .deb and its release are not affected.
  # ---------------------------------------------------------------------------------------------
  app:
    name: Build the Speaka app (.tipa for TrollStore)
    # v9.5: the app carries the tweak's .deb, so it's built after the tweak, from the tweak's own artifact. The release
    # still never waits on the app.
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          XCODE=/Applications/Xcode_16.4.app
          if [ -d "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          else
            echo "::warning::$XCODE not found, using the image default"
          fi
          xcodebuild -version

      - name: Install build tools (XcodeGen, ldid)
        run: brew install xcodegen ldid

      - name: Compute the version
        id: version
        run: echo "version=$(bash tools/release_version.sh)" >> "$GITHUB_OUTPUT"

      - name: Get the tweak the app carries
        uses: actions/download-artifact@v8
        with:
          name: Speaka-deb
          path: carried

      - name: Build Speaka.tipa
        run: |
          set -euo pipefail
          deb="$(ls carried/*.deb | head -n 1)"
          make -C app clean tipa VERSION="${{ steps.version.outputs.version }}" BUILD="$GITHUB_RUN_NUMBER" DEB="$PWD/$deb"

      - name: Check the package
        run: |
          set -euo pipefail
          tipa=app/packages/Speaka.tipa
          test -s "$tipa" || { echo "::error::$tipa was not built"; exit 1; }
          cmp "$tipa" app/packages/Speaka.ipa || { echo "::error::Speaka.ipa is missing or differs from Speaka.tipa"; exit 1; }
          rm -rf tipacheck && mkdir tipacheck && unzip -q "$tipa" -d tipacheck
          bundle=tipacheck/Payload/Speaka.app
          for f in Speaka speakahelper Info.plist Assets.car AppIcon60x60@2x.png AppIcon60x60@3x.png LICENSE-Dopamine.txt; do
            test -s "$bundle/$f" || { echo "::error::$f is missing from Speaka.app"; exit 1; }
          done
          test -x "$bundle/speakahelper" || { echo "::error::speakahelper is not executable"; exit 1; }
          # One .tipa installs both: the app carries exactly this release's .deb.
          carried="$(ls carried/*.deb | head -n 1)"
          cmp "$bundle/Speaka.deb" "$carried" || { echo "::error::Speaka.app doesn't carry this release's tweak"; exit 1; }
          case "$(basename "$carried")" in
            *"_${{ steps.version.outputs.version }}_"*) echo "Carries the tweak: $(basename "$carried")" ;;
            *) echo "::error::the carried tweak $(basename "$carried") isn't ${{ steps.version.outputs.version }}"; exit 1 ;;
          esac
          echo "Slices: Speaka $(lipo -archs "$bundle/Speaka"), speakahelper $(lipo -archs "$bundle/speakahelper")"
          ldid -e "$bundle/Speaka" > entitlements.plist
          grep -q 'com.apple.private.security.no-sandbox' entitlements.plist \
            || { echo "::error::Speaka is not signed with its entitlements"; cat entitlements.plist; exit 1; }
          grep -q 'com.apple.private.persona-mgmt' entitlements.plist \
            || { echo "::error::Speaka can't start its update helper as root without persona-mgmt"; exit 1; }
          ldid -e "$bundle/speakahelper" > helper-entitlements.plist
          grep -q 'com.apple.private.security.no-sandbox' helper-entitlements.plist \
            || { echo "::error::speakahelper is not signed with its entitlements"; cat helper-entitlements.plist; exit 1; }
          plutil -p "$bundle/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion'
          shown="$(plutil -extract CFBundleShortVersionString raw "$bundle/Info.plist")"
          [ "$shown" = "${{ steps.version.outputs.version }}" ] \
            || { echo "::error::the app says $shown, the release is ${{ steps.version.outputs.version }}"; exit 1; }
          echo "Package OK: $(du -h "$tipa" | cut -f1)"

      # GitHub's artifact service sometimes times out after a good build (run 62: ETIMEDOUT on the app's upload, so its
      # release went out with only the .deb). One more try, 30 s later, before the job fails.
      - name: Upload the app
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Speaka-app
          path: |
            app/packages/Speaka.tipa
            app/packages/Speaka.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Wait, then upload the app again
        if: steps.upload.outcome == 'failure'
        run: sleep 30

      - name: Upload the app (second try)
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: Speaka-app
          path: |
            app/packages/Speaka.tipa
            app/packages/Speaka.ipa
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # ---------------------------------------------------------------------------------------------
  # Publish. Only main and v* tags; only if the build job succeeded.
  # ---------------------------------------------------------------------------------------------
  release:
    name: Publish to GitHub Releases
    # Waits for the app too, but publishes whenever the tweak built: Speaka.tipa and .ipa are attached only if it built,
    # so an app failure never holds back the .deb.
    needs: [build, app]
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write            # create/update releases and tags
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false  # queue; never kill a half-finished publish
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Speaka-deb
          path: dist

      - name: Add the Speaka app
        if: needs.app.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: Speaka-app
          path: dist

      - name: Checksums for everything published
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=( *.deb *.tipa *.ipa )
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail
          ls -la dist
          short="${GITHUB_SHA:0:7}"
          first_deb=""
          for f in dist/*.deb; do first_deb="$f"; break; done
          deb_name="$(basename "$first_deb")"

          # The notes are this push's commit messages, as in Caz: the app's updater shows them as its changelog.
          notes="$(jq -r '.[]? | "- " + (.message | split("\n")[0])' <<< "${COMMITS_JSON:-null}" || true)"
          [ -n "$notes" ] || notes="- Build of commit ${short}"
          printf '%s\n' "$notes" > notes.md
          if [ -f dist/Speaka.tipa ] && [ -f dist/Speaka.ipa ]; then
            echo "Release ${VERSION}: ${deb_name}, Speaka.tipa and Speaka.ipa" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # The updater then updates only the tweak.
            echo "- This release has only the tweak: the app didn't build in this run." >> notes.md
          fi
          cat notes.md

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"                  # a tag you pushed yourself, like v9.4.0
          else
            tag="v${VERSION}"                         # every push to main: v9.3.57
            gh release delete nightly --cleanup-tag --yes >/dev/null 2>&1 || true   # retire the old rolling build
          fi
          # GitHub's release service sometimes fails partway. In run 68 an upload was retried and refused ("ReleaseAsset.name
          # already exists"), then deleting the half-made draft got HTTP 500, so v9.7.68 was never published. So: up to
          # three tries, 30 s apart, each first clearing drafts that GitHub Actions left behind (never anyone else's).
          # Inside a function called from `if`, bash ignores set -e, so every step returns its failure itself.
          publish() {
            local id
            for id in $(gh api "repos/${GH_REPO}/releases?per_page=100" \
                          --jq '.[] | select(.draft and .author.login == "github-actions[bot]") | .id' 2>/dev/null || true); do
              gh api -X DELETE "repos/${GH_REPO}/releases/${id}" >/dev/null 2>&1 || true
            done
            if gh release view "$tag" >/dev/null 2>&1; then
              # A re-run of the same version: replace the files and the notes, which may have said the app was
              # missing (the updater shows them as the changelog), and make sure it's published, not a draft.
              gh release upload "$tag" dist/* --clobber || return 1
              gh release edit "$tag" --notes-file notes.md --draft=false || return 1
            elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              gh release create "$tag" dist/* --verify-tag --title "${VERSION}" --notes-file notes.md --latest || return 1
            else
              gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "${VERSION}" --notes-file notes.md --latest || return 1
            fi
          }
          for attempt in 1 2 3; do
            if publish; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Publishing failed three times"
              exit 1
            fi
            echo "::warning::Publishing failed (attempt ${attempt} of 3); trying again in 30 s"
            sleep 30
          done

          echo "Published: https://github.com/${GH_REPO}/releases/tag/${tag}" | tee -a "$GITHUB_STEP_SUMMARY"
